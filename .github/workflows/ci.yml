name: CI

on:
  push:
    branches:
      - "*"
    tags-ignore:
      - "*"
    paths-ignore:
      - "*.md"
  pull_request:
    paths-ignore:
      - "*.md"

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:

        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest

        lua-version:
          - 5.1
          - 5.2
          - 5.3
          - 5.4
          - 5.5
          - luajit
          - openresty

        toolchain:
          - msvc
          - cc

        exclude:

          - os: ubuntu-latest
            toolchain: msvc

          - os: macos-latest
            toolchain: msvc
    steps:

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup MSVC developer prompt
        uses: step-security/msvc-dev-cmd@22c98154b708dbd743e6f27a933cf6ceba3305c4 # v1.13.1
        if: ${{ runner.os == 'Windows' && matrix.toolchain == 'msvc' }}

      - name: Install Lua
        uses: luau-project/setup-lua@c47c002fc60841a11b22ef3058c86a3d08acf218 # v2.0.1
        with:
          lua-version: ${{ matrix.lua-version }}

      - name: Print Lua version
        run: lua -v

      - name: Print LuaRocks version
        run: luarocks --version

      - name: Lint rockspec and Test through NMake
        run: nmake /F Makefile.windows clean all lint-rockspecs test
        if: ${{ runner.os == 'Windows' && matrix.toolchain == 'msvc' }}

      - name: Lint rockspec and Test through GNU Make for MinGW / MinGW-w64
        run: mingw32-make -f Makefile.windows clean all lint-rockspecs test
        if: ${{ runner.os == 'Windows' && matrix.toolchain != 'msvc' }}

      - name: Lint rockspec and Test through make
        run: make -f Makefile.unix clean all lint-rockspecs test
        if: ${{ runner.os != 'Windows' }}