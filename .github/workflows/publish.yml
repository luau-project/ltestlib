name: Publish to LuaRocks

on: workflow_dispatch

jobs:

  get-version-from-library:
    name: Get the library version
    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}

      - name: Get version from the library
        id: version
        run: |
          version=$(grep -oP 'local version = "(\d+\.\d+\.\d+)"' ltestlib.lua | grep -oP '(\d+\.\d+\.\d+)')
          if [[ $version ~= ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "version=${version}" >> "$GITHUB_OUTPUT"
          else
            echo "version=none" >> "$GITHUB_OUTPUT"
          fi

  get-latest-rockspec:
    name: Get the latest rockspec
    runs-on: ubuntu-latest

    outputs:
      rockspec: ${{ steps.rockspec.outputs.rockspec }}

    steps:

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}

      - name: Get the latest rockspec sorted by version in the name
        id: rockspec
        run: |
          rockspec=$(git ls-files '*.rockspec' | sort --version-sort | tail -n2 | head -n1)

          if test -e "${rockspec}"; then
            echo "rockspec=${rockspec}" >> "$GITHUB_OUTPUT"
          else
            echo "rockspec=none" >> "$GITHUB_OUTPUT"
          fi

  get-version-from-tag:
    name: Get version from the tag
    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:

      - name: Extract version from the tag
        id: version
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            version=$(echo "${{ github.ref_name }}" | sed -e "s|v||g" | grep -oP '^$(\d+\.\d+\.\d+)$')

            if [[ $version ~= ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "version=${version}" >> "$GITHUB_OUTPUT"
            else
              echo "version=none" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "version=none" >> "$GITHUB_OUTPUT"
          fi

  match-versions:
    name: Match versions from lib, rockspec and tag
    runs-on: ubuntu-latest
    needs:
      - get-version-from-library
      - get-latest-rockspec
      - get-version-from-tag
    if: |
      ${{
        needs.get-version-from-library.outputs.version != 'none' &&
        needs.get-latest-rockspec.outputs.rockspec != 'none' &&
        needs.get-version-from-tag.outputs.version != 'none' &&
        needs.get-version-from-library.outputs.version == needs.get-version-from-tag.outputs.version
      }}

    steps:

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}

      - name: Install Lua
        uses: luau-project/setup-lua@c47c002fc60841a11b22ef3058c86a3d08acf218 # v2.0.1

      - name: Validate rockspec basename
        run: |
          rockspec_basename="$(basename "${{ needs.get-latest-rockspec.outputs.rockspec }}")"
          rockspec_basename_version=$(echo "${rockspec_basename}" | cut -d- -f2)
          if [ "${rockspec_basename_version}" != "${{ needs.get-version-from-library.outputs.version }}" ]; then
            echo "version in the basename of the latest rockspec (${rockspec_basename_version}) is not ${{ needs.get-version-from-library.outputs.version }}";
            exit 1;
          fi

      - name: Validate rockspec tag
        run: |
          rockspec_tag=$(lua -e "dofile(arg[0]); io.write(source.tag);" -- "${{ needs.get-latest-rockspec.outputs.rockspec }}")
          if [ "${rockspec_tag}" != "v${{ github.ref_name }}" ]; then
            echo "source.tag (${rockspec_tag}) is not v${{ github.ref_name }}";
            exit 1;
          fi

  upload-rockspec:
    name: Upload rockspec
    runs-on: ubuntu-latest
    needs:
      - get-latest-rockspec
      - match-versions
    if: |
      ${{
        github.actor == 'luau-project' &&
        github.triggering_actor == 'luau-project' &&
        github.repository == 'luau-project/ltestlib' &&
        github.ref_type == 'tag'
      }}

    steps:

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}

      - name: Install Lua
        uses: luau-project/setup-lua@c47c002fc60841a11b22ef3058c86a3d08acf218 # v2.0.1

      - name: Install system dependencies
        run: sudo apt install -y libssl-dev

      - name: Install upload dependency (LuaSocket)
        run: luarocks install luasocket

      - name: Install upload dependency (LuaSec)
        run: luarocks install luasec

      - name: Install upload dependency (dkjson)
        run: luarocks install dkjson

      - name: Upload rockspec
        env:
          UPLOAD_KEY: ${{ secrets.LUAROCKS_API_KEY }}
        run: luarocks upload "${{ needs.get-latest-rockspec.outputs.rockspec }}" "--temp-key=$UPLOAD_KEY" "--skip-pack"